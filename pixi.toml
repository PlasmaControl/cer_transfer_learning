[workspace]
name = "cer-transfer"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<3"
joblib = ">=1.3"
pandas = ">=2.0"
tqdm = ">=4.66"
seaborn = ">=0.13"

# torch stack from PyPI with bundled CUDA runtime (no module load / system
# CUDA needed; works on Stellar's A100 nodes). torch and torchaudio are
# resolved together and frozen in pixi.lock — this is what prevents the
# undefined-symbol ABI mismatch that broke the old ml-env.
[pypi-dependencies]
torch = ">=2.4,<2.6"
torchaudio = ">=2.4,<2.6"
torcheval = ">=0.0.7"
tensorboard = ">=2.16"  # only needed for --tensorboard
line-profiler = ">=4.1"  # only needed for cer_transfer.analysis.profile_lines
ray = { version = ">=2.30,<3", extras = ["tune"] }

[tasks]
train = "python -u train.py"
finetune = "python -u finetune.py"
tune = "python -u tune.py"
smoke = "python -c 'import torch, ray, numpy, joblib; print(torch.__version__, torch.cuda.is_available())'"
eval = "python -u eval_checkpoint.py"
figs = "bash scripts/make_figs.sh"
test = "python -m tests.smoke"
